services:
  hz-node-1:
    image: hazelcast/hazelcast:5.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5701/hazelcast/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: ["5701:5701"]
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml
      - HZ_NETWORK_RESTAPI_ENABLED=true
  hz-node-2:
    image: hazelcast/hazelcast:5.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5701/hazelcast/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: ["5702:5701"]
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml
      - HZ_NETWORK_RESTAPI_ENABLED=true
  hz-node-3:
    image: hazelcast/hazelcast:5.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5701/hazelcast/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: ["5703:5701"]
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/config/hazelcast.yaml
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/opt/hazelcast/config/hazelcast.yaml
      - HZ_NETWORK_RESTAPI_ENABLED=true
  mancenter:
    image: hazelcast/management-center:5.3
    ports: ["8081:8080"]
    environment:
      - HZ_MC_DEFAULT_CLUSTER_MEMBERS=hz-node-1,hz-node-2,hz-node-3

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: balances
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500" 
      - "8600:8600/udp" 
    command: "agent -dev -client=0.0.0.0"

  consul-init:
    image: curlimages/curl:latest
    depends_on:
      - consul
    command: >
      sh -c "
      sleep 5;
      curl -X PUT -d 'hz-node-1:5701,hz-node-2:5701,hz-node-3:5701' http://consul:8500/v1/kv/config/hazelcast/servers;
      curl -X PUT -d 'log' http://consul:8500/v1/kv/config/hazelcast/cluster_name;
      curl -X PUT -d 'counter-queue' http://consul:8500/v1/kv/config/mq/queue_name;
      curl -X PUT -d 'postgresql://user:password@db:5432/balances' http://consul:8500/v1/kv/config/db/url;
      echo 'Consul KVs initialized';
      "

  logging-service-1:
    build: ./logging-service
    container_name: logging-service-1
    depends_on:
      consul-init:
        condition: service_completed_successfully
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - MY_HOST=logging-service-1

  logging-service-2:
    build: ./logging-service
    container_name: logging-service-2
    depends_on:
      consul-init:
        condition: service_completed_successfully
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - MY_HOST=logging-service-2

  logging-service-3:
    build: ./logging-service
    container_name: logging-service-3
    depends_on:
      consul-init:
        condition: service_completed_successfully
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - MY_HOST=logging-service-3

  counter-service:
    build: ./counter-service
    container_name: counter-service
    depends_on:
      - db
      - consul-init
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/balances
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - MY_HOST=counter-service

  facade-service:
    build: ./facade-service
    ports:
      - "8080:8000"
    depends_on:
      - consul-init
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - MY_HOST=facade-service

volumes:
  postgres_data: